steps:
  - uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: 'zulu'
      java-version: '17'

  - name: Set up Flutter
    uses: subosito/flutter-action@v2
    with:
      flutter-version: '3.x' # or your version

  - name: Get dependencies
    run: flutter pub get

  - name: Build APK
    run: flutter build apk --release
